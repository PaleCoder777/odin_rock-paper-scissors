<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <section id="gamestart">
        <h1 id="title">Rock, Paper, Scissors?</h1>
        <h3 id="instructions">AI is coming for our jobs, head to the frontlines and prepare yourself to defend the workforce, quickly!
        </h3>
        <p>Pick your weapon of choice!</p>
    </section>

    <section id="gameButtons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </section>

    <section id="gameScores">
        <div id="currentRound">This will display who has struck the other!</div>
        <div id="runningScore">Running Score | Computer: <span id="computerScore"></span> You: <span id="humanScore"></span></div>
        <div id="gameOver">Who will strike 5 times first in this battle?</div>
    </section>

</body>
</html>
