<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <section id="gamestart">
        <h1 id="title">Rock, Paper, Scissors Game</h1>
        <h3 id="instructions">How to play: ADD INSTRUCTION HERE</h3>
        <p>Round Selection: Pick your weapon of choice!</p>
    </section>

    <section id="gameButtons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </section>

    <section id="gameScores">
        <div id="currentRound">
            This area will show who won the round,displaying both
            your and the computer choice</div>
        <div id="runningScore">Display the running game score here</div>
        <div id="gameOver">Announce the winner when someone has 5 points here</div>
    </section>

</body>
</html>
